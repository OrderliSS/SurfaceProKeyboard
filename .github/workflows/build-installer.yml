name: Build & Release Desktop Installer

on:
  push:
    tags: [ '*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore SurfaceTypeCoverManager.sln

      - name: Run Unit Tests
        run: dotnet test SurfaceTypeCoverManager.Tests/SurfaceTypeCoverManager.Tests.csproj --configuration Release --no-restore

      - name: Publish Self-Contained Win-x64 Application
        run: |
          dotnet publish SurfaceTypeCoverManager.UI/SurfaceTypeCoverManager.UI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o ./publish

      - name: Verify wwwroot in Publish Output
        run: |
          Write-Host "--- Checking for wwwroot ---"
          if (Test-Path ./publish/wwwroot) {
            Get-ChildItem ./publish/wwwroot -Recurse | Select-Object FullName
          } else {
            Write-Host "WARNING: wwwroot not found in publish output!"
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/setup.iss
          Write-Host "--- Installer output ---"
          Get-ChildItem installer_output -Recurse

      - name: Package Portable Zip
        run: |
          New-Item -ItemType Directory -Force -Path installer_output | Out-Null
          Compress-Archive -Path ./publish/* -DestinationPath ./installer_output/SurfaceTypeCoverManager_Portable_win-x64.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SurfaceTypeCoverManager-Desktop-Client
          path: |
            installer_output/SurfaceTypeCoverManager_Setup_*.exe
            installer_output/SurfaceTypeCoverManager_Portable_win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Creating release for tag: $tag"

          # Create the release if it doesn't exist
          gh release create $tag --title "Surface Type Cover Manager $tag" --notes "Release $tag of Surface Type Cover Manager" --draft=false 2>$null

          # Upload artifacts (--clobber replaces if they exist)
          $installer = Get-ChildItem installer_output/SurfaceTypeCoverManager_Setup_*.exe | Select-Object -First 1
          gh release upload $tag `
            $installer.FullName `
            installer_output/SurfaceTypeCoverManager_Portable_win-x64.zip `
            --clobber
